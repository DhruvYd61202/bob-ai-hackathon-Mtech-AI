submission:
  title: "DeepFake ForensicAI"
  problem_statement: >
    Deepfake videos are increasingly being used in crimes such as sextortion and fraud.
    Cyber cells lack a structured analysis framework, legal packaging tools, and the capability
    to efficiently detect synthetic media manipulation.
  solution_summary: >
    A Bob-powered cyber cell investigation assistant that guides officers through deepfake
    analysis. It detects visual and audio anomalies using pre-trained Vision Transformers and
    Wav2Vec 2.0, generates an evidence summary, and maps cases to IT Act 2000 / BNS sections.
  key_features:
    - "Visual Deepfake Detection using Vision Transformer with Grad-CAM overlays"
    - "Audio Deepfake & Voice-Clone Detection using Wav2Vec 2.0"
    - "Cryptographic Chain of Custody Audit Ledger"
    - "IBM Bob Integration for drafting court-admissible expert opinion reports"
